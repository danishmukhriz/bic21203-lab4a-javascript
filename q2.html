<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 2 - Smart Number Validator</title>
</head>
<body>

  <label for="userInput">Enter a number:</label>
  <input type="text" id="userInput" placeholder="Enter a number">
  <button id="checkBtn" type="button">Check</button>
  <p id="result" role="status" aria-live="polite"></p>

  <script>
    document.getElementById("checkBtn").addEventListener("click", checkInput);

    function checkInput() {
      const inputVal = document.getElementById("userInput").value.trim();
      const resultEl = document.getElementById("result");

      if (inputVal === "" || isNaN(inputVal)) {
        resultEl.textContent = "Please enter a valid number!";
        return;
      }

      const num = Number(inputVal);

      if (num < 10) {
        resultEl.textContent = "The number is lower than 10";
      } else if (num > 10) {
        resultEl.textContent = "The number is higher than 10";
      } else {
        resultEl.textContent = "The number is equal to 10";
      }
    }
  </script>

</body>
</html>
